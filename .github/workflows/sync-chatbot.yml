name: Sync Chatbot
on:
  push:
    paths:
      - '.github/workflows/sync-chatbot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest chatbot
        run: curl -L --fail --retry 3 https://raw.githubusercontent.com/5rangepekoe2-rgb/chat-bot/main/index.html -o index.html
      - name: Commit chatbot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add improved embedded JSON chatbot" || exit 0
          git push
# sync trigger
