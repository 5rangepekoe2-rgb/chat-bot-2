name: Build Plain JSON Chatbot
on:
  push:
    paths:
      - '.github/workflows/sync-chatbot.yml'
      - 'convert_to_plain_json.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert compressed payload to plain embedded JSON
        run: python convert_to_plain_json.py
      - name: Commit rebuilt chatbot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use plain embedded JSON in chatbot"
            git push
          fi
